name: Front Deploy (contorno OIDC)

# O OIDC da role forest-dev-github confia no workflow DESTE repositório (o trust
# aponta para enois-backend). O do FRONT quebrou quando a org virou Rede-ENois e a
# trust não foi atualizada — então ESTE workflow constrói o código do FRONT e
# publica a imagem dele, usando a identidade que funciona. É contorno, não solução:
# quando a trust policy ganhar o sub do front, o workflow original volta a ser o caminho.

on:
  workflow_dispatch:

env:
  AWS_REGION: us-east-1
  ECR_REGISTRY: 818928662779.dkr.ecr.us-east-1.amazonaws.com
  ECR_REPOSITORY: enois/frontend
  GITOPS_REPO: florestaencantada/integration_gitops
  GITOPS_BRANCH: main
  MANIFEST_PATH: clusters/forest-dev/applications/enois-app.yaml

jobs:
  build-front:
    name: 🏗️ Build & Push da imagem do FRONT
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ steps.vars.outputs.image_tag }}
    steps:
      - name: 📥 Checkout do FRONT
        uses: actions/checkout@v4
        with:
          repository: florestaencantada/enois-frontend
          ref: main
          token: ${{ secrets.GITOPS_TOKEN }}

      - name: 🏷️ Tag da imagem
        id: vars
        run: |
          SHA_SHORT=$(git rev-parse --short HEAD)
          echo "image_tag=${SHA_SHORT}" >> $GITHUB_OUTPUT
          echo "image_ref=${{ env.ECR_REGISTRY }}/${{ env.ECR_REPOSITORY }}:${SHA_SHORT}" >> $GITHUB_OUTPUT

      - name: ⚙️ Credenciais AWS via OIDC (a confiança deste repo está sã)
        uses: aws-actions/configure-aws-credentials@v6.2.4
        with:
          role-to-assume: arn:aws:iam::818928662779:role/forest-dev-github
          aws-region: ${{ env.AWS_REGION }}

      - name: 🔑 Login no Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: 🐳 Build & Push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.vars.outputs.image_ref }}

  promote-gitops-front:
    name: 🔄 GitOps Update (front)
    needs: build-front
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout do Repositório GitOps
        uses: actions/checkout@v4
        with:
          repository: ${{ env.GITOPS_REPO }}
          ref: ${{ env.GITOPS_BRANCH }}
          token: ${{ secrets.GITOPS_TOKEN }}
          path: gitops-repo

      - name: ✏️ Atualizar a tag da imagem do FRONT
        run: |
          cd gitops-repo
          echo "==> Atualizando ${{ env.MANIFEST_PATH }} para tag ${{ needs.build-front.outputs.image_tag }}"
          sed -i -E \
            "s|(image:\s*${{ env.ECR_REGISTRY }}/${{ env.ECR_REPOSITORY }}:).*|\1${{ needs.build-front.outputs.image_tag }}|g" \
            "${{ env.MANIFEST_PATH }}"
          git diff "${{ env.MANIFEST_PATH }}"

      - name: 🚀 Commit & Push no GitOps
        run: |
          cd gitops-repo
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add "${{ env.MANIFEST_PATH }}"
          if git diff --staged --quiet; then
            echo "Nenhuma mudança de imagem, pulando commit."
            exit 0
          fi
          git commit \
            -m "ci(front-contorno): atualiza imagem para ${{ needs.build-front.outputs.image_tag }}" \
            -m "Disparado pelo commit ${{ github.sha }} por @${{ github.actor }}"
          git push origin ${{ env.GITOPS_BRANCH }}
