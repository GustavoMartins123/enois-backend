name: Build, Push and GitOps Deploy

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

env:
  AWS_REGION: us-east-1
  ECR_REGISTRY: 818928662779.dkr.ecr.us-east-1.amazonaws.com
  ECR_REPOSITORY: enois/backend
  ECR_REPOSITORY_FRONT: enois/frontend
  GITOPS_REPO: florestaencantada/integration_gitops
  GITOPS_BRANCH: main
  MANIFEST_PATH: clusters/forest-dev/applications/enois-app.yaml

permissions:
  id-token: write
  contents: read

jobs:
  # =========================================================================
  # ETAPA 1: Build da imagem Docker e Push para o ECR
  # =========================================================================
  build-and-push:
    name: 🐳 Build & Push Docker Image
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ steps.vars.outputs.sha_short }}
      image_ref: ${{ steps.vars.outputs.image_ref }}

    steps:
      - name: 📥 Checkout do código
        uses: actions/checkout@v4

      - name: 🏷️ Definir Tag (SHA Curto)
        id: vars
        run: |
          SHA_SHORT=$(echo "${{ github.sha }}" | cut -c1-7)
          echo "sha_short=${SHA_SHORT}" >> $GITHUB_OUTPUT
          echo "image_ref=${{ env.ECR_REGISTRY }}/${{ env.ECR_REPOSITORY }}:${SHA_SHORT}" >> $GITHUB_OUTPUT

      - name: ⚙️ Configurar Credenciais AWS via OIDC
        uses: aws-actions/configure-aws-credentials@v6.2.4
        with:
          role-to-assume: arn:aws:iam::818928662779:role/forest-dev-enois-ecr
          aws-region: ${{ env.AWS_REGION }}

      - name: 🔑 Login no Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Verifica e cria o repositório no ECR
        uses: int128/create-ecr-repository-action@v1
        with:
          repository: ${{ env.ECR_REPOSITORY }}

      - name: ⚙️ Configurar Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 🚀 Build & Push para o ECR
        id: build
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ${{ env.ECR_REGISTRY }}/${{ env.ECR_REPOSITORY }}:${{ steps.vars.outputs.sha_short }}
            ${{ env.ECR_REGISTRY }}/${{ env.ECR_REPOSITORY }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # =========================================================================
  # ETAPA 2: Promoção GitOps → EKS Floresta
  # =========================================================================
  promote-gitops:
    name: 🔄 GitOps Update → EKS Floresta
    needs: build-and-push
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout do Repositório GitOps (integration_onprem)
        uses: actions/checkout@v4
        with:
          repository: ${{ env.GITOPS_REPO }}
          ref: ${{ env.GITOPS_BRANCH }}
          token: ${{ secrets.GITOPS_TOKEN }}
          path: gitops-repo

      - name: ✏️ Atualizar Tag da Imagem no Manifesto
        run: |
          cd gitops-repo
          echo "==> Atualizando ${{ env.MANIFEST_PATH }} para tag ${{ needs.build-and-push.outputs.image_tag }}"

          # Atualiza a tag da imagem no skilrush-front
          sed -i -E \
            "s|(image:\s*${{ env.ECR_REGISTRY }}/${{ env.ECR_REPOSITORY }}:).*|\1${{ needs.build-and-push.outputs.image_tag }}|g" \
            "${{ env.MANIFEST_PATH }}"

          echo "Diff gerado:"
          git diff "${{ env.MANIFEST_PATH }}"

      - name: 🔐 Credenciais do LinkedIn no manifesto (env do pod)
        env:
          MANIFEST: ${{ env.MANIFEST_PATH }}
          LINKEDIN_CLIENT_ID: ${{ secrets.LINKEDIN_CLIENT_ID }}
          LINKEDIN_CLIENT_SECRET: ${{ secrets.LINKEDIN_CLIENT_SECRET }}
          LINKEDIN_REDIRECT_URI: ${{ secrets.LINKEDIN_REDIRECT_URI }}
        run: |
          cd gitops-repo
          python3 -c 'import os
          path = os.environ["MANIFEST"]
          vals = [("LINKEDIN_CLIENT_ID", os.environ["LINKEDIN_CLIENT_ID"]),
                  ("LINKEDIN_CLIENT_SECRET", os.environ["LINKEDIN_CLIENT_SECRET"]),
                  ("LINKEDIN_REDIRECT_URI", os.environ["LINKEDIN_REDIRECT_URI"])]
          lines = open(path).read().split("
")
          out = []
          i = 0
          while i < len(lines):
              line = lines[i]
              stripped = line.strip()
              if stripped.startswith("- name: "):
                  name = stripped[len("- name: "):]
                  match = [v for v in vals if v[0] == name]
                  if match:
                      out.append(line)
                      i += 1
                      while i < len(lines) and not lines[i].strip().startswith("- name:"):
                          i += 1
                      indent = line[:len(line) - len(line.lstrip())]
                      out.append(indent + "  value: " + repr(match[0][1]))
                      continue
              out.append(line)
              i += 1
          content = "
".join(out)
          for name, value in vals:
              if "- name: " + name not in content:
                  anchor = "        - name: REDE_FRONTEND_URL\n"
                  block = "        - name: " + name + "\n          value: " + repr(value) + "\n"
                  content = content.replace(anchor, anchor + block, 1)
          open(path, "w").write(content)
          '

      - name: 🚀 Commit & Push no GitOps
        run: |
          cd gitops-repo
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add "${{ env.MANIFEST_PATH }}"

          if git diff --staged --quiet; then
            echo "Nenhuma mudança de imagem, pulando commit."
            exit 0
          fi

          git commit \
            -m "ci(skillify-frontend): atualiza imagem para ${{ needs.build-and-push.outputs.image_tag }}" \
            -m "Disparado pelo commit ${{ github.sha }} por @${{ github.actor }}"

          git push origin ${{ env.GITOPS_BRANCH }}

  # =========================================================================
  # CONTORNO: a trust policy da role fixa job_workflow_ref (build-and-push.yml),
  # então o deploy do FRONT passa por AQUI enquanto o sub do enois-frontend não
  # entra no IAM. Constrói o código do front e publica enois/frontend.
  front-build-and-deploy:
    name: 🚧 Front Deploy (contorno)
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ steps.vars.outputs.image_tag }}
    steps:
      - name: 📥 Checkout do FRONT
        uses: actions/checkout@v4
        with:
          repository: florestaencantada/enois-frontend
          ref: main
          token: ${{ secrets.GITOPS_TOKEN }}

      - name: 🏷️ Tag da imagem
        id: vars
        run: |
          SHA_SHORT=$(git rev-parse --short HEAD)
          echo "image_tag=${SHA_SHORT}" >> $GITHUB_OUTPUT
          echo "image_ref=${{ env.ECR_REGISTRY }}/${{ env.ECR_REPOSITORY_FRONT }}:${SHA_SHORT}" >> $GITHUB_OUTPUT

      - name: ⚙️ Credenciais AWS via OIDC
        uses: aws-actions/configure-aws-credentials@v6.2.4
        with:
          role-to-assume: arn:aws:iam::818928662779:role/forest-dev-enois-ecr
          aws-region: ${{ env.AWS_REGION }}

      - name: 🔑 Login no Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: 🐳 Build & Push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.vars.outputs.image_ref }}

  front-gitops:
    name: 🔄 GitOps Update (front)
    needs: front-build-and-deploy
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout do GitOps
        uses: actions/checkout@v4
        with:
          repository: ${{ env.GITOPS_REPO }}
          ref: ${{ env.GITOPS_BRANCH }}
          token: ${{ secrets.GITOPS_TOKEN }}
          path: gitops-repo

      - name: ✏️ Atualizar a tag da imagem do FRONT
        run: |
          cd gitops-repo
          sed -i -E \
            "s|(image:\s*${{ env.ECR_REGISTRY }}/${{ env.ECR_REPOSITORY_FRONT }}:).*|\1${{ needs.front-build-and-deploy.outputs.image_tag }}|g" \
            "${{ env.MANIFEST_PATH }}"
          git diff "${{ env.MANIFEST_PATH }}"

      - name: 🚀 Commit & Push no GitOps
        run: |
          cd gitops-repo
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add "${{ env.MANIFEST_PATH }}"
          if git diff --staged --quiet; then
            echo "Nenhuma mudança de imagem, pulando commit."
            exit 0
          fi
          git commit -m "ci(front): atualiza imagem para ${{ needs.front-build-and-deploy.outputs.image_tag }}"
          git push origin ${{ env.GITOPS_BRANCH }}
