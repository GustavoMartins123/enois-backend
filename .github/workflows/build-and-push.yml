name: Deploy Enois Backend via Foxbyte Universal CI/CD

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    name: Build, Scan and GitOps Deploy
    uses: foxbyte-games/foxbyte-infra/.github/workflows/universal-service-cicd.yml@feature/pipeline_deploy
    with:
      app_name: "enois-backend"
      app_type: "backend"
      system: "enois"
      domain: "social"
      owner: "social-team"
      database: "mariadb"
      container_port: 8081
      health_path: "/actuator/health"
      target_environment: "dev"
      gitops_repo: "foxbyte-games/foxbyte-infra"
      gitops_branch: "feature/pipeline_deploy"
      aws_region: "us-east-1"
      aws_account_id: "765009073478"
    secrets:
      GITOPS_PAT: ${{ secrets.GITOPS_PAT }}
