name: Relatar um problema
description: Um endpoint, uma regra ou um job não se comporta como deveria
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Antes de abrir: procure nas issues existentes e confirme que é o **backend**.
        Se for falha de **segurança**, não use este formulário — veja o `SECURITY.md`.
  - type: textarea
    id: o-que-aconteceu
    attributes:
      label: O que aconteceu
      description: Requisição (sem token), resposta recebida e o que era esperado.
    validations:
      required: true
  - type: textarea
    id: passos
    attributes:
      label: Como reproduzir
      placeholder: |
        1. subir o backend (./mvnw spring-boot:run)
        2. POST /api/...
        3. resposta 409 em vez de 200
    validations:
      required: true
  - type: input
    id: endpoint
    attributes:
      label: Endpoint ou módulo
      description: Caminho da rota, ou o módulo (feed, jobs, coin, moderation...).
    validations:
      required: false
  - type: textarea
    id: log
    attributes:
      label: Trecho do log
      description: O erro completo, do `Caused by` para baixo — sem tokens nem dados pessoais.
    validations:
      required: false
  - type: dropdown
    id: banco
    attributes:
      label: Onde aconteceu
      options:
        - Testes (H2)
        - Local
        - Produção (enois.ia.br)
