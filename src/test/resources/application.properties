spring.profiles.active=dev

# Email Configuration
spring.mail.host=${MAIL_HOST:localhost}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:noreply@socialcoisa.com}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

rede.frontend.url=${FRONTEND_URL:}

# ATENCAO: este arquivo tem o mesmo nome do src/main/resources/application.properties, entao ele
# SOMBREIA o do main no classpath de teste (o Spring carrega apenas o primeiro encontrado). Tudo que
# for essencial para o teste precisa estar declarado aqui — nao ha merge com o do main.

# O teste nao tem SMTP: sem desligar o indicador, /actuator/health responde 503 e o teste de contrato
# do actuator quebra por um motivo que nao e o que ele esta verificando.
management.health.mail.enabled=false

# Chave fixa de teste para cifrar segredos do segundo fator (32 bytes em base64).
rede.security.encryption-key=9uQ2mZ0Kx8Vn3v5m1Yb7Qe4Tt6Wc8Vb0Nn2MmL4Kp1U=

# Administrador de teste (AdminGuard é allowlist de e-mail): só a conta "group-admin" da suíte.
rede.admin.emails=group-admin@test.com

# Os testes criam dezenas de contas do mesmo "IP" (o MockMvc não tem um): limite alto aqui, como já
# é feito com o resilience4j. O teste do limitador (IdentityRateLimitTests) aperta os valores por
# @DynamicPropertySource, então o comportamento real continua coberto.
rede.security.rate-limit.signup.limit=1000
rede.security.rate-limit.login.limit=1000
rede.security.rate-limit.password.limit=1000
rede.security.rate-limit.email.limit=1000
rede.security.rate-limit.2fa.limit=1000

# O throttle por conta/IP (AuthThrottle) também abre na suíte: as contas nascem todas do mesmo
# "IP" (o MockMvc não tem um). O teste do throttle aperta os valores por @DynamicPropertySource.
rede.auth.throttle.login-max-failures=1000
rede.auth.throttle.signup-per-hour=1000

# Test Rate Limiting
resilience4j.ratelimiter.instances.auth.limit-for-period=1000
resilience4j.ratelimiter.instances.search.limit-for-period=1000
resilience4j.ratelimiter.instances.email-sending.limit-for-period=1000

# Atencao: as propriedades deste arquivo sao sobrescritas pelas do perfil ativo
# (application-dev.properties). O que precisa vencer um valor do perfil vai em
# @TestPropertySource na propria classe de teste.

# Testes: sem importacao de vagas externas (nao bate na rede nem roda o worker paralelo).
rede.jobs.import.jobradar.enabled=false
rede.jobs.import.external-refresh-enabled=false
rede.moderation.ai.triage-enabled=false

# O worker de posts agendados nao pode disparar no meio dos testes: o teste chama publishDue()
# na hora que quer e uma rodada paralela do agendador tornaria as tentativas nao deterministicas.
rede.feed.schedule-delay-ms=3600000

# Acoes que alimentam credibilidade nao podem bater no teto durante a suite (que cria relacoes,
# denuncias e recomendacoes em lote); o comportamento real tem teste proprio.
rede.moderation.reports-per-hour=1000
rede.profile.recommendations-per-day=1000

# O job de ranking nao precisa rodar durante os testes (delay enorme).
rede.reputation.refresh-delay-ms=3600000
rede.reputation.refresh-initial-delay-ms=3600000

# O comunicado de recuperacao do armazenamento NUNCA dispara sozinho na suite (teste chama na mao).
rede.communications.recovery-delay-ms=3600000
rede.communications.recovery-initial-delay-ms=3600000
