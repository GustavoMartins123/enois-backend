spring.profiles.active=dev

# Email Configuration
spring.mail.host=${MAIL_HOST:localhost}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:noreply@socialcoisa.com}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

rede.frontend.url=${FRONTEND_URL:}

# ATENCAO: este arquivo tem o mesmo nome do src/main/resources/application.properties, entao ele
# SOMBREIA o do main no classpath de teste (o Spring carrega apenas o primeiro encontrado). Tudo que
# for essencial para o teste precisa estar declarado aqui — nao ha merge com o do main.

# O teste nao tem SMTP: sem desligar o indicador, /actuator/health responde 503 e o teste de contrato
# do actuator quebra por um motivo que nao e o que ele esta verificando.
management.health.mail.enabled=false

# Chave fixa de teste para cifrar segredos do segundo fator (32 bytes em base64).
rede.security.encryption-key=9uQ2mZ0Kx8Vn3v5m1Yb7Qe4Tt6Wc8Vb0Nn2MmL4Kp1U=

# Test Rate Limiting
resilience4j.ratelimiter.instances.auth.limit-for-period=1000
resilience4j.ratelimiter.instances.search.limit-for-period=1000
resilience4j.ratelimiter.instances.email-sending.limit-for-period=1000

# Atencao: as propriedades deste arquivo sao sobrescritas pelas do perfil ativo
# (application-dev.properties). O que precisa vencer um valor do perfil vai em
# @TestPropertySource na propria classe de teste.

# Testes: sem importacao de vagas externas (nao bate na rede nem roda o worker paralelo).
rede.jobs.import.jobradar.enabled=false
rede.jobs.import.external-refresh-enabled=false